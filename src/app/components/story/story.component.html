<section class="story section" aria-label="Zašto CeroLeather">
  <div class="container">
    <ol class="story__pillars" appReveal="stagger">
      @for (p of pillars; track p.title; let i = $index) {
        <li class="pillar">
          <span class="pillar__num">0{{ i + 1 }}</span>
          <h3 class="pillar__title">{{ p.title }}</h3>
          <p class="pillar__text">{{ p.text }}</p>
        </li>
      }
    </ol>
  </div>

  <div class="story__band">
    <img
      appParallax
      [parallaxAmount]="18"
      class="story__band-img"
      src="assets/images/products/strap-vest-detail-grain.webp"
      alt=""
      loading="lazy"
    />
    <div class="container story__band-inner">
      <p class="display display--lg" appReveal="lines">
        <span class="line"><span>Za svaku priliku</span></span>
        <span class="line"><span class="text-red">u svakom trenutku.</span></span>
      </p>
    </div>
  </div>
</section>
